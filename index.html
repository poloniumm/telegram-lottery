
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#180b0b">
<title>Jackpot — Scratch Lottery</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px 12px 35px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at top, #542016, #160b10 75%);
    font-family: Arial, sans-serif;
    color: #fff4d8;
}

.app {
    width: 100%;
    max-width: 560px;
    text-align: center;
}

.heading {
    margin-bottom: 14px;
    color: #f5d58a;
    font-size: 12px;
    letter-spacing: 4px;
    font-weight: bold;
}

.description {
    margin: 0 0 18px;
    color: #e6cda5;
    font-size: 13px;
}

/* Основа билета */

.ticket {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 15px 45px #0009;
    background: #8e2118;
}

.ticket-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Игровые окошки */

.reel {
    position: absolute;
    top: 69.1%;
    height: 14.2%;
    width: 21.1%;
    overflow: hidden;
    background: #b7b2a7;
    border-radius: 2px;
}

/* Координаты трёх окошек относительно билета */

.reel:nth-child(2) { left: 15.7%; }
.reel:nth-child(3) { left: 37.5%; }
.reel:nth-child(4) { left: 59.4%; }

.symbol {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 7%;
    background: linear-gradient(145deg, #fff1c5, #d8c6a2);
}

.symbol img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Стираемый слой */

.scratch-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
}

.ticket-result {
    min-height: 58px;
    margin-top: 18px;
    padding: 12px;
    border: 1px solid #a87932;
    border-radius: 12px;
    background: #321510;
    color: #f8d98c;
    font-weight: bold;
    font-size: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 1.4;
}

.ticket-result.win {
    background: linear-gradient(120deg, #693a0c, #a56b19);
    border-color: #ffdf83;
    animation: celebration 0.8s ease infinite alternate;
}

@keyframes celebration {
    from { box-shadow: 0 0 5px #ffce63; }
    to { box-shadow: 0 0 24px #ffce63; }
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    border: 1px solid #f5d58a;
    border-radius: 12px;
    background: linear-gradient(110deg, #ffe7a1, #bd812b);
    color: #30150d;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

.note {
    margin-top: 13px;
    color: #c7a98d;
    font-size: 11px;
    line-height: 1.5;
}
</style>
</head>

<body>

<main class="app">

    <div class="heading">✦ WELCOME TO THE JACKPOT ✦</div>

    <p class="description">
        Открой три окошка и узнай, повезло ли тебе!
    </p>

    <section class="ticket" id="ticket">

        <!-- Фоновое изображение билета -->
        <img
            class="ticket-background"
            src="./assets/ticket/jackpot-ticket.png"
            alt="Jackpot lottery ticket"
        >

        <!-- Первое окошко -->
        <div class="reel">
            <div class="symbol">
                <img id="symbol1" src="" alt="Символ 1">
            </div>
            <canvas class="scratch-canvas"></canvas>
        </div>

        <!-- Второе окошко -->
        <div class="reel">
            <div class="symbol">
                <img id="symbol2" src="" alt="Символ 2">
            </div>
            <canvas class="scratch-canvas"></canvas>
        </div>

        <!-- Третье окошко -->
        <div class="reel">
            <div class="symbol">
                <img id="symbol3" src="" alt="Символ 3">
            </div>
            <canvas class="scratch-canvas"></canvas>
        </div>

    </section>

    <div class="ticket-result" id="result">
        ✧ Сотри все три окошка ✧
    </div>

    <button id="newTicket">
        ПОЛУЧИТЬ НОВЫЙ БИЛЕТ
    </button>

    <div class="note">
        Демонстрационная версия Jackpot.
        Результаты пока генерируются в браузере и не сохраняются.
    </div>

</main>

<script>

// ==========================================
// 1. ИГРОВЫЕ СИМВОЛЫ
// ==========================================

const SYMBOLS = {
    lesha: "./assets/symbols/lesha.png",
    seven: "./assets/symbols/seven.png",
    cherries: "./assets/symbols/cherries.png",
    star: "./assets/symbols/star.png",
    diamond: "./assets/symbols/diamond.png",
    lemon: "./assets/symbols/lemon.png",
    clover: "./assets/symbols/clover.png"
};

// ==========================================
// 2. ОПРЕДЕЛЕНИЕ КОМБИНАЦИИ
// ==========================================

function generateCombination() {

    const random = Math.random();

    // Демонстрационный суперприз
    if (random < 0.02) {
        return ["lesha", "lesha", "lesha"];
    }

    // Промежуточный приз
    if (random < 0.10) {
        return ["cherries", "cherries", "cherries"];
    }

    // Небольшой приз
    if (random < 0.20) {
        return ["star", "star", "star"];
    }

    // Остальные комбинации
    const available = [
        "seven",
        "cherries",
        "star",
        "diamond",
        "lemon",
        "clover"
    ];

    return [
        randomSymbol(available),
        randomSymbol(available),
        randomSymbol(available)
    ];
}

function randomSymbol(array) {
    return array[Math.floor(Math.random() * array.length)];
}

// ==========================================
// 3. РАБОТА СО СТИРАЕМЫМИ ОКОШКАМИ
// ==========================================

const canvases = Array.from(
    document.querySelectorAll(".scratch-canvas")
);

const revealed = [false, false, false];

const resultElement = document.getElementById("result");

let currentCombination = [];

function drawScratchLayer(canvas) {

    const rect = canvas.getBoundingClientRect();

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);

    const ctx = canvas.getContext("2d", {
        willReadFrequently: true
    });

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Серебристый защитный слой

    const gradient = ctx.createLinearGradient(
        0, 0, rect.width, rect.height
    );

    gradient.addColorStop(0, "#e9e3d7");
    gradient.addColorStop(0.45, "#aaa9a5");
    gradient.addColorStop(1, "#d9d1c1");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, rect.width, rect.height);

    // Металлическая текстура

    for (let i = 0; i < 180; i++) {

        ctx.strokeStyle =
            i % 2 ? "#ffffff35" : "#554c4030";

        ctx.lineWidth = 1;

        const x = Math.random() * rect.width;
        const y = Math.random() * rect.height;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 12, y + 8);
        ctx.stroke();
    }

    // Надпись

    ctx.fillStyle = "#453b37";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "bold 10px Arial";

    ctx.fillText(
        "SCRATCH",
        rect.width / 2,
        rect.height / 2 - 5
    );

    ctx.font = "8px Arial";

    ctx.fillText(
        "✦ JACKPOT ✦",
        rect.width / 2,
        rect.height / 2 + 10
    );

    ctx.globalCompositeOperation = "destination-out";

    return ctx;
}

const contexts = canvases.map(drawScratchLayer);

const scratching = [false, false, false];

const lastPositions = [
    {x: 0, y: 0},
    {x: 0, y: 0},
    {x: 0, y: 0}
];

function getPosition(canvas, event) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}

function startScratch(index, event) {

    if (revealed[index]) return;

    scratching[index] = true;

    const canvas = canvases[index];
    const ctx = contexts[index];

    const pos = getPosition(canvas, event);

    lastPositions[index] = pos;

    try {
        canvas.setPointerCapture(event.pointerId);
    } catch (_) {}

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 17, 0, Math.PI * 2);
    ctx.fill();

    event.preventDefault();
}

function moveScratch(index, event) {

    if (!scratching[index] || revealed[index]) return;

    const canvas = canvases[index];
    const ctx = contexts[index];

    const pos = getPosition(canvas, event);
    const last = lastPositions[index];

    ctx.lineWidth = 35;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();

    lastPositions[index] = pos;

    event.preventDefault();

    checkScratchProgress(index);
}

function stopScratch(index) {
    scratching[index] = false;
}

// ==========================================
// 4. ПРОВЕРКА ПРОГРЕССА СТИРАНИЯ
// ==========================================

function checkScratchProgress(index) {

    const canvas = canvases[index];

    const ctx = contexts[index];

    const pixels = ctx.getImageData(
        0, 0, canvas.width, canvas.height
    ).data;

    let transparent = 0;
    let total = 0;

    // Анализируем каждый четвёртый пиксель

    for (let i = 3; i < pixels.length; i += 16) {

        total++;

        if (pixels[i] < 128) {
            transparent++;
        }
    }

    const percentage = transparent / total;

    if (percentage > 0.43) {
        revealWindow(index);
    }
}

function revealWindow(index) {

    if (revealed[index]) return;

    revealed[index] = true;

    scratching[index] = false;

    const canvas = canvases[index];

    canvas.style.transition = "opacity 0.35s ease";
    canvas.style.opacity = "0";
    canvas.style.pointerEvents = "none";

    setTimeout(() => {
        canvas.style.display = "none";
    }, 350);

    updateProgress();
}

// ==========================================
// 5. ПРОВЕРКА ВЫИГРЫША
// ==========================================

function updateProgress() {

    const opened = revealed.filter(Boolean).length;

    if (opened < 3) {

        resultElement.classList.remove("win");

        resultElement.textContent =
            `Открыто окошек: ${opened} из 3`;

        return;
    }

    checkCombination();
}

function checkCombination() {

    const [a, b, c] = currentCombination;

    let message = "";
    let isWin = false;

    if (a === "lesha" && b === "lesha" && c === "lesha") {

        message = "👑 ДЖЕКПОТ! ТЫ ВЫИГРАЛ СУПЕРПРИЗ! 👑";
        isWin = true;

    } else if (
        a === "cherries" &&
        b === "cherries" &&
        c === "cherries"
    ) {

        message = "🍒 ПОЗДРАВЛЯЕМ! ПРОМЕЖУТОЧНЫЙ ПРИЗ!";
        isWin = true;

    } else if (
        a === "star" &&
        b === "star" &&
        c === "star"
    ) {

        message = "⭐ ТЫ ВЫИГРАЛ НЕБОЛЬШОЙ ПРИЗ!";
        isWin = true;

    } else if (
        a === "diamond" &&
        b === "diamond" &&
        c === "diamond"
    ) {

        message = "💎 РЕДКИЙ ПРИЗ! ПОЗДРАВЛЯЕМ!";
        isWin = true;

    } else {

        message = "🍀 В этот раз без выигрыша. Попробуй ещё!";
    }

    resultElement.textContent = message;

    resultElement.classList.toggle("win", isWin);
}

// ==========================================
// 6. СОЗДАНИЕ НОВОГО БИЛЕТА
// ==========================================

function newTicket() {

    currentCombination = generateCombination();

    resultElement.classList.remove("win");

    resultElement.textContent =
        "✧ Сотри все три окошка ✧";

    for (let i = 0; i < 3; i++) {

        revealed[i] = false;
        scratching[i] = false;

        const img = document.getElementById(
            `symbol${i + 1}`
        );

        img.src = SYMBOLS[currentCombination[i]];

        const canvas = canvases[i];

        canvas.style.display = "block";
        canvas.style.opacity = "1";
        canvas.style.pointerEvents = "auto";

        drawScratchLayer(canvas);
    }
}

// ==========================================
// 7. ОБРАБОТЧИКИ СОБЫТИЙ
// ==========================================

canvases.forEach((canvas, index) => {

    canvas.addEventListener("pointerdown", event => {
        startScratch(index, event);
    });

    canvas.addEventListener("pointermove", event => {
        moveScratch(index, event);
    });

    canvas.addEventListener("pointerup", () => {
        stopScratch(index);
    });

    canvas.addEventListener("pointercancel", () => {
        stopScratch(index);
    });

    canvas.addEventListener("lostpointercapture", () => {
        stopScratch(index);
    });
});

document.getElementById("newTicket")
    .addEventListener("click", newTicket);

window.addEventListener("resize", () => {

    for (let i = 0; i < 3; i++) {

        if (!revealed[i]) {
            drawScratchLayer(canvases[i]);
        }
    }
});

// Проверка загрузки изображений

Object.entries(SYMBOLS).forEach(([name, path]) => {

    const img = new Image();

    img.onerror = () => {
        console.error("Не удалось загрузить символ:", name, path);
    };

    img.src = path;
});

newTicket();

</script>

</body>
</html>
